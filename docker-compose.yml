name: transcendence

services:
  nginx:
    container_name: nginx
    build: ./src/nginx
    networks:
      - transcendence
    depends_on:
      - frontend
      - backend
    ports:
      - 80:80
      - 443:443

  frontend:
    container_name: frontend
    build: ./src/frontend
    networks:
        - transcendence
    expose: 
      - "3000"

  backend:
    container_name: backend
    build: ./src/backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    expose:
      - "8080"
    networks:
      - transcendence

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
        - transcendence

volumes:
  db_data:

networks:
  transcendence:
    driver: bridge

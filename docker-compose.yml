name: transcendence

services:
  nginx:
    container_name: nginx
    image: nginx
    build: ./src/nginx
    networks:
      - transcendence
    depends_on:
      - frontend
    ports:
      - 80:80
      - 443:443

  frontend:
    container_name: frontend
    image: frontend
    build: ./src/frontend
    networks:
        - transcendence
    expose: 
      - "3000"

  backend:
    container_name: backend
    image: backend
    build: ./src/backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8080:8080"
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:

networks:
  transcendence:
    driver: bridge

secrets:
  nginx-key:
    file: secrets/nginx.key
  nginx-crt:
    file: secrets/nginx.crt

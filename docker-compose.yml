name: transcendence

services:
  frontend:
    container_name: frontend
    image: frontend
    build: ./src/frontend
    ports: 
      - 3000:3000
  backend:
    container_name: backend
    image: backend
    build: ./src/backend
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  db_data: